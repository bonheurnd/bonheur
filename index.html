    <script>
      // Early suppression of Vite HMR / WebSocket connection errors in sandbox/iframe environment
      (function() {
        function shouldSuppress(value) {
          if (!value) return false;
          var str = '';
          if (typeof value === 'string') {
            str = value;
          } else if (value instanceof Error) {
            str = (value.message || '') + ' ' + (value.stack || '') + ' ' + (value.name || '');
          } else if (typeof value === 'object') {
            try {
              str = JSON.stringify(value);
            } catch (e) {
              str = String(value);
            }
          } else {
            str = String(value);
          }
          var lower = str.toLowerCase();
          return (
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('ws://') !== -1 ||
            lower.indexOf('wss://') !== -1 ||
            lower.indexOf('[vite]') !== -1 ||
            lower.indexOf('failed to connect to websocket') !== -1 ||
            lower.indexOf('closed without opened') !== -1 ||
            lower.indexOf('server connection lost') !== -1
          );
        }

        // Intercept global window error events in capture phase
        window.addEventListener('error', function(event) {
          if (
            shouldSuppress(event.message) ||
            shouldSuppress(event.error) ||
            (event.target && event.target.tagName === 'SCRIPT' && shouldSuppress(event.target.src))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (shouldSuppress(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept console.error to avoid polluting error trackers with expected iframe websocket drops
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        // Hide any vite-error-overlay custom element if triggered by transient websocket disconnects
        var observer = new MutationObserver(function() {
          var overlay = document.querySelector('vite-error-overlay');
          if (overlay) {
            var content = overlay.shadowRoot ? overlay.shadowRoot.innerHTML : overlay.innerHTML;
            if (shouldSuppress(content)) {
              overlay.remove();
            }
          }
        });

        if (document.documentElement) {
          observer.observe(document.documentElement, { childList: true, subtree: true });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.documentElement, { childList: true, subtree: true });
          });
        }
      })();
    </script>
