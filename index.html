<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>La Lumiere Choir</title>
    <meta name="description" content="Digital hymn/songbook, audio library, choir community, and Mobile Money support platform for La Lumiere Choir, ADEPR Nyanza, Kicukiro District, Rwanda." />
    <meta property="og:title" content="La Lumiere Choir" />
    <meta property="og:description" content="Digital hymn/songbook, audio library, choir community, and Mobile Money support platform for La Lumiere Choir, ADEPR Nyanza, Kicukiro District, Rwanda." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Lumiere" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Suppress Vite HMR / WebSocket connection error overlay in dev iframe environment
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
            event.message.includes('ws://') ||
            event.message.includes('wss://') ||
            event.message.includes('[vite]'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var text = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          text.includes('WebSocket') ||
          text.includes('ws://') ||
          text.includes('wss://') ||
          text.includes('[vite]')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
