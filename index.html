  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Suppress Vite HMR / WebSocket connection error overlay in dev iframe environment
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          var str = String(msg);
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('server connection lost') !== -1
          );
        }

        window.addEventListener('error', function (event) {
          if (shouldSuppress(event.message) || shouldSuppress(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var text = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (shouldSuppress(text)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        // Hide any vite-error-overlay custom element if triggered by transient websocket disconnects
        var observer = new MutationObserver(function(mutations) {
          var overlay = document.querySelector('vite-error-overlay');
          if (overlay && shouldSuppress(overlay.shadowRoot ? overlay.shadowRoot.innerHTML : overlay.innerHTML)) {
            overlay.remove();
          }
        });
        if (document.body) {
          observer.observe(document.body, { childList: true, subtree: true });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { childList: true, subtree: true });
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
